workflows:
  apk:
    name: Build APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build
        script: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o g.zip
          unzip -q g.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
